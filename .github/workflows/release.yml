name: Build and attach release packages

# Builds the APK/AAB on GitHub's runners (the repository already contains the
# voice models, so nothing is downloaded at runtime) and attaches the packages to
# the v1.0.0 release. Trigger it by hand, or automatically when a release is
# published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag that receives the packages
        required: false
        default: v1.0.0
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android/keystore
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > ci-release.jks
            store_password="${KEYSTORE_PASSWORD}"
            key_alias="${KEY_ALIAS:-jarvis}"
            key_password="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
          else
            store_password="$(openssl rand -hex 16)"
            key_alias="jarvis"
            key_password="${store_password}"
            keytool -genkeypair -keystore ci-release.jks -storepass "${store_password}" \
              -keypass "${key_password}" -alias "${key_alias}" -keyalg RSA -keysize 4096 \
              -validity 10000 -dname "CN=Jarvis CI, OU=Jarvis, O=Jarvis, C=IN"
            echo "::warning title=Throwaway signing key::No KEYSTORE_BASE64 secret is set, so this APK is signed with a CI-only key. Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to sign with your own upload key."
          fi
          {
            echo "storeFile=ci-release.jks"
            echo "storePassword=${store_password}"
            echo "keyAlias=${key_alias}"
            echo "keyPassword=${key_password}"
          } > keystore.properties

      - name: Build debug APK, release APK and release AAB
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Verify the packages contain the bundled voice models
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q "assets/models/asr/tiny-encoder.int8.onnx"
          unzip -l "$apk" | grep -q "assets/models/tts/hi/model.onnx"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so"
          model_entries=$(unzip -l "$apk" | grep -c "assets/models/")
          echo "bundled model entries: ${model_entries}"
          test "${model_entries}" -ge 371

      - name: Write checksums
        working-directory: android/app/build/outputs
        run: |
          sha256sum apk/debug/app-debug.apk apk/release/app-release.apk \
            bundle/release/app-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Keep the debug build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
